# SPDX-License-Identifier: AGPL-3.0-or-later
# Deploys the marketing site (website/) to the Pages root and a live build of
# the web app to /app, so https://<user>.github.io/neoma/ is the site and
# .../neoma/app/ runs the actual PWA. No manual setup needed — the
# configure-pages step below provisions the Pages site on first run.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a newer one supersede.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build the web app (served under /neoma/app/)
        env:
          NEOMA_BASE: /neoma/app/
        run: npm run build

      - name: Assemble the bundle (site at root, app at /app, policy pages)
        run: node scripts/build-site.mjs

      # enablement: true provisions the Pages site on first run instead of
      # failing with "Get Pages site failed". Without it this workflow needs a
      # manual Settings -> Pages -> Source: GitHub Actions before it will ever
      # succeed, which is a trap for a fresh clone or fork.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
